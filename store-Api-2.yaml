paths:
  /user:
    post:
      tags:
        - User
      summary: create user
      requestBody:
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              properties:
                name:
                  type: string
                  example: '{{$randomNoun}}'
                cellphone:
                  type: integer
                  example: '09035441578'
                email:
                  type: string
                  example: mostafaniakan96@gmail.com
                email_verified_at:
                  type: string
                  example: mostafaniakan96@gmail.com
                password:
                  type: integer
                  example: '12345678'
      parameters:
        - name: Accept
          in: header
          schema:
            type: string
          example: application/json
      responses:
        '200':
          description: Successful response
          content:
            application/json: {}
        '404':
          description: Not Found
          content:
            application/json:
              schema:
                type: object
                required:
                  - name
                properties:
                  name:
                    type: string
                    x-stoplight:
                      id: jol57pxp7j3ju
                    description: required
              examples:
                Example 1:
                  value:
                    message: string
          headers: {}
