openapi: 3.0.0
info:
  title: store Api
  version: 1.0.0
servers:
  - url: 'http://{{shopurl}}'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
    noauthAuth:
      type: http
      scheme: noauth
